# Backend API Nginx Configuration
# Location: /etc/nginx/sites-available/backend-api
# Enable: sudo ln -s /etc/nginx/sites-available/backend-api /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.yourdomain.com;  # Replace with your domain or EC2 public IP

    # IMPORTANT: Increase client body size for large image uploads (25MB)
    # Default is 1MB, which would block your 20MB images
    client_max_body_size 30M;
    
    # Increase buffer sizes for large uploads
    client_body_buffer_size 128k;
    
    # Increase timeouts for large file uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    location / {
        proxy_pass http://localhost:5454;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Bypass cache for upgrades
        proxy_cache_bypass $http_upgrade;
        
        # Disable buffering for large uploads (allows streaming)
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Health check endpoint (optional)
    location /api/health {
        proxy_pass http://localhost:5454/api/health;
        access_log off;
    }
}

