server {

    server_name jnvtaa.in www.jnvtaa.in;

    # ========== LARGE FILE UPLOAD SETTINGS ==========
    # Allow up to 30MB uploads (25MB + overhead)
    client_max_body_size 30M;
    client_body_buffer_size 128k;
    
    # Increase timeouts for large file uploads (5 minutes)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # ---------- FRONTEND ----------
    root /var/www/jnvtaa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5454/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for API (already set globally above, but can override here)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # CRITICAL: Disable buffering for large uploads (allows streaming)
        # This prevents nginx from loading entire file into memory
        proxy_request_buffering off;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jnvtaa.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jnvtaa.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.jnvtaa.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jnvtaa.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name jnvtaa.in www.jnvtaa.in;
    return 404; # managed by Certbot
}
